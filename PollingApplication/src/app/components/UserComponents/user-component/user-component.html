<div class="container mt-4">
  <h2><i class="bi bi-people"></i> All Users</h2>

  <div class="row mt-4 g-3">
    @for (user of users; track $index) {
        <div class="col-md-6 col-lg-4" style="text-align: center;">
             <app-single-user-component 
             [user]="user"
             (userUpdated)="loadUsers()"></app-single-user-component>
        </div>
     
    }
  </div>
</div>
